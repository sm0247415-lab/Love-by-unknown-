<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Love Trick</title>
<style>
  body {
    font-family: 'Courier New', monospace;
    text-align: center;
    background: linear-gradient(135deg,#ff5f6d,#ffc371);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  input {
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 5px;
    border: none;
    margin-bottom: 10px;
  }
  button {
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 5px;
    border: none;
    background-color: #ff5f6d;
    color: white;
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
  }
  h1 {
    font-size: 48px;
    color: white;
    margin-bottom: 20px;
  }
  .heart {
    position: absolute;
    font-size: 24px;
    color: red;
    animation: float 2s linear forwards;
  }
  @keyframes float {
    0% {transform: translateY(0) scale(1); opacity:1;}
    100% {transform: translateY(-200px) scale(1.5); opacity:0;}
  }
</style>
</head>
<body>

<h1 id="display">I love you ❤️</h1>
<input type="text" id="userInput" placeholder="Type something...">
<button id="loveBtn">Submit</button>

<script>
const btn = document.getElementById('loveBtn');
const input = document.getElementById('userInput');

function createHeart(x, y){
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.style.left = x + 'px';
  heart.style.top = y + 'px';
  heart.innerText = '❤️';
  document.body.appendChild(heart);
  setTimeout(()=> heart.remove(), 2000);
}

// Button constantly moves randomly (hacker-style)
function moveButtonRandomly() {
  const x = Math.random() * (window.innerWidth - btn.offsetWidth);
  const y = Math.random() * (window.innerHeight - btn.offsetHeight - 50);
  btn.style.left = x + 'px';
  btn.style.top = y + 'px';
}
setInterval(moveButtonRandomly, 1500);

// Check input and force "I love you"
function forceLove(){
  let text = input.value.toLowerCase();
  document.getElementById('display').innerText = "I love you ❤️";
  input.value = '';

  if(text.includes("i don't like you")){
    // More hearts if user dislikes
    for(let i=0;i<10;i++){
      createHeart(Math.random() * window.innerWidth, window.innerHeight - 50);
    }
    // Extra button dodge
    moveButtonRandomly();
  }
}

// Auto-change input typing to I love you
input.addEventListener('input', ()=>{
  document.getElementById('display').innerText = "I love you ❤️";
});

btn.addEventListener('click', forceLove);
</script>
</body>
</html>
